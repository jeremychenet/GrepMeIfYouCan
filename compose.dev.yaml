services:
  web:
    build:
      target: dev
    env_file:
      - path: .env
        required: false
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    ports:
      # Temporary direct access; replaced by the Nginx proxy on :8080 in J2.
      - "127.0.0.1:4321:4321"

volumes:
  node_modules:
