# Shared by the two /stats locations (nginx.conf, nginx.prod.conf). No add_header here: it
# would drop the security headers inherited from the server block.
proxy_http_version 1.1;
proxy_set_header Host $host;
# The client address as seen by the proxy, never a client-supplied list:
# Umami derives its anonymous visitor hash from it.
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header Cookie "";
proxy_hide_header Set-Cookie;
proxy_hide_header X-Powered-By;
# Umami sends its own, looser security headers: keep only ours.
proxy_hide_header Content-Security-Policy;
proxy_hide_header X-Frame-Options;
proxy_hide_header X-Content-Type-Options;
proxy_hide_header Referrer-Policy;
proxy_hide_header Strict-Transport-Security;
proxy_hide_header Permissions-Policy;
proxy_hide_header Access-Control-Allow-Origin;
proxy_hide_header Access-Control-Allow-Headers;
proxy_hide_header Access-Control-Allow-Methods;
proxy_connect_timeout 2s;
proxy_read_timeout 10s;
