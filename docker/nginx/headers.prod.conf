# Every response header of a production HTTPS server (SPEC §7.4). Include it
# again in any location that has its own add_header (they drop inherited ones).

include /etc/nginx/snippets/security-headers.conf;
include /etc/nginx/snippets/csp.conf;
# $hsts is empty (header not sent) except on the public domain (nginx.prod.conf).
add_header Strict-Transport-Security $hsts always;
