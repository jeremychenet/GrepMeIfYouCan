# Security headers shared by dev and prod (SPEC §7.4).
# `always` also sends them on error responses.
# Note: any `add_header` inside a location drops these inherited headers;
# include this file again in such a location.
# HSTS is prod-only (it would force HTTPS on localhost): see headers.prod.conf.

add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=(), interest-cohort=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
