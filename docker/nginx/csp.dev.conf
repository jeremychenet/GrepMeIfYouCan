# Dev CSP. Same as prod except two relaxations required by hot reload (SPEC §7.4):
#   - style-src 'unsafe-inline': Vite injects <style> tags for CSS HMR.
#   - connect-src ws://<host>: Vite HMR WebSocket.
# Inline scripts stay forbidden, even in dev.

add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' ws://$http_host; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
