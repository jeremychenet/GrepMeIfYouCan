# Production server (SPEC §6.1, §6.7), baked into the `prod` image as
# /etc/nginx/conf.d/default.conf. Serves the static build and proxies
# /stats/script.js and /stats/api/send to Umami, like the dev proxy
# (nginx.conf): same /stats rules, same security headers, strict CSP.
#
# Listens on 8080 (HTTP) and 8443 (HTTPS), published as 80/443 by
# compose.prod.yaml, so no capability is needed. Known hosts:
#   - grepmeifyoucan.com: the site;
#   - www.grepmeifyoucan.com: 301 to the apex;
#   - localhost: the site, for `make prod-local` (no HSTS).
# Any other host gets no answer (444 on HTTP, TLS handshake refused).
#
# Certificates: Let's Encrypt layout under /etc/letsencrypt (certbot volume in
# J20, a self-signed one from scripts/make-local-cert.sh for prod-local).

server_tokens off;
# Redirects keep a relative Location: the container port (8443) is not the
# public one (443).
absolute_redirect off;

# HSTS for the public domain only: on localhost it would force HTTPS on every
# local project (SPEC §7.4). Short max-age first, 1 year once stable (§6.1).
map $host $hsts {
    grepmeifyoucan.com      "max-age=300";
    www.grepmeifyoucan.com  "max-age=300";
    default                 "";
}

# HTTP → HTTPS keeps the host, except www which goes straight to the apex.
map $host $canonical_host {
    www.grepmeifyoucan.com  grepmeifyoucan.com;
    default                 $host;
}

# Umami collection: per client IP, small bursts allowed (SPEC §7.5).
limit_req_zone $binary_remote_addr zone=stats_collect:10m rate=10r/s;

gzip on;
gzip_vary on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types text/css text/plain application/javascript application/json application/xml image/svg+xml;

ssl_certificate     /etc/letsencrypt/live/grepmeifyoucan.com/fullchain.pem;
ssl_certificate_key /etc/letsencrypt/live/grepmeifyoucan.com/privkey.pem;
# Mozilla "intermediate" profile.
ssl_protocols TLSv1.2 TLSv1.3;
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
ssl_prefer_server_ciphers off;
ssl_session_cache shared:SSL:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;

# ---- HTTP ----------------------------------------------------------------

# Unknown hosts (IP scans...). Still answers /healthz: the container
# healthcheck calls http://127.0.0.1:8080/healthz.
server {
    listen 8080 default_server;
    server_name _;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / { return 444; }
}

server {
    listen 8080;
    server_name grepmeifyoucan.com www.grepmeifyoucan.com localhost;

    # Let's Encrypt HTTP-01 challenge (certbot webroot, J20).
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 301 https://$canonical_host$request_uri;
    }
}

# ---- HTTPS ---------------------------------------------------------------

# Unknown host names (SNI): the TLS handshake is refused.
server {
    listen 8443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}

server {
    listen 8443 ssl;
    http2 on;
    server_name www.grepmeifyoucan.com;
    include /etc/nginx/snippets/headers.prod.conf;
    return 301 https://grepmeifyoucan.com$request_uri;
}

server {
    listen 8443 ssl;
    http2 on;
    server_name grepmeifyoucan.com localhost;

    root /usr/share/nginx/html;
    include /etc/nginx/snippets/headers.prod.conf;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Umami is optional: its address is looked up at request time (Docker DNS),
    # so the site starts without it and /stats answers 502 while it is down.
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $umami umami:3000;

    location = /stats/script.js {
        proxy_pass http://$umami/script.js;
        include /etc/nginx/snippets/stats-proxy.conf;
    }

    location = /stats/api/send {
        limit_except POST { deny all; }
        # Its Referer holds the page URL, search query included: not logged.
        access_log off;
        limit_req zone=stats_collect burst=20 nodelay;
        limit_req_status 429;
        client_max_body_size 8k;
        proxy_pass http://$umami/api/send;
        include /etc/nginx/snippets/stats-proxy.conf;
    }

    location = /stats { return 404; }
    location ^~ /stats/ { return 404; }

    # Styled 404 page (src/pages/404.astro), not reachable as /404.html.
    error_page 404 /404.html;
    location = /404.html {
        internal;
        expires -1;
    }

    # Hashed file names (Astro): cached for a year.
    location ^~ /_astro/ {
        limit_except GET { deny all; }
        expires 1y;
        try_files $uri =404;
    }

    location ^~ /fonts/ {
        limit_except GET { deny all; }
        expires 30d;
        try_files $uri =404;
    }

    location = / {
        limit_except GET { deny all; }
        expires -1;
        try_files /index.html =404;
    }

    # Pages and other files: the build writes c/<id>.html for /c/<id>
    # (SPEC §2.4). Always revalidated, so a deploy shows up at once.
    location / {
        limit_except GET { deny all; }
        expires -1;
        # /c/<id>/ → /c/<id>: one URL per page.
        rewrite ^/(.+)/$ /$1 permanent;
        try_files $uri $uri.html =404;
    }
}
