# Dev proxy: single entry point on :8080, mounted as /etc/nginx/conf.d/default.conf.
# Routes: / -> web (Astro dev server); /stats/script.js and /stats/api/send ->
# umami (profile `analytics`, SPEC §6.4). Every other /stats URL is a 404: the
# Umami admin is never reachable through the proxy.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream web {
    server web:4321;
}

# Umami collection: per client IP, small bursts allowed (SPEC §7.5).
limit_req_zone $binary_remote_addr zone=stats_collect:10m rate=10r/s;

server {
    listen 8080;
    server_name _;
    server_tokens off;

    include /etc/nginx/snippets/security-headers.conf;
    include /etc/nginx/snippets/csp.conf;

    # Liveness probe for the proxy itself (used by healthchecks).
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Umami is optional: its address is looked up at request time (Docker DNS),
    # so the proxy starts without it and /stats answers 502 while it is down.
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $umami umami:3000;

    location = /stats/script.js {
        proxy_pass http://$umami/script.js;
        include /etc/nginx/snippets/stats-proxy.conf;
    }

    location = /stats/api/send {
        limit_except POST { deny all; }
        # Its Referer holds the page URL, search query included: not logged.
        access_log off;
        limit_req zone=stats_collect burst=20 nodelay;
        limit_req_status 429;
        client_max_body_size 8k;
        proxy_pass http://$umami/api/send;
        include /etc/nginx/snippets/stats-proxy.conf;
    }

    location = /stats { return 404; }
    location ^~ /stats/ { return 404; }

    location / {
        proxy_pass http://web;
        proxy_http_version 1.1;
        # WebSocket upgrade for Vite hot reload.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;
    }
}
