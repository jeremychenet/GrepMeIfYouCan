# Dev proxy: single entry point on :8080, mounted as /etc/nginx/conf.d/default.conf.
# Routes: / -> web (Astro dev server). /stats -> umami is added in J17.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream web {
    server web:4321;
}

server {
    listen 8080;
    server_name _;
    server_tokens off;

    include /etc/nginx/snippets/security-headers.conf;
    include /etc/nginx/snippets/csp.conf;

    # Liveness probe for the proxy itself (used by healthchecks).
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        proxy_pass http://web;
        proxy_http_version 1.1;
        # WebSocket upgrade for Vite hot reload.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;
    }
}
