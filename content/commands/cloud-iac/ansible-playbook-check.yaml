id: ansible-playbook-check
title: Preview the changes a playbook would make
description: Runs the playbook in check mode, which reports what would change, with a diff of modified files, without touching the hosts.
command: ansible-playbook {{playbook:site.yml}} --check --diff
tool: ansible
category: cloud-iac
tags: [playbook, dry-run]
danger: safe
