id: ansible-facts
title: Gather facts about a group of hosts
description: Runs the setup module on each host of the group and prints its facts, such as OS, network interfaces and memory.
command: ansible {{group:all}} -m setup
tool: ansible
category: cloud-iac
tags: [ad-hoc, facts]
danger: safe
