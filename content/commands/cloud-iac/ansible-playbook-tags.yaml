id: ansible-playbook-tags
title: Run only the playbook tasks with given tags
description: Runs the playbook but only executes the tasks and roles labeled with one of the comma-separated tags.
command: ansible-playbook {{playbook:site.yml}} --tags {{tags}}
tool: ansible
category: cloud-iac
tags: [playbook, tags]
danger: caution
