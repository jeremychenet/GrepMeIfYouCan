id: ansible-command-inventory
title: Run a command on hosts from a specific inventory
description: Executes the command on the group's hosts as listed in the given inventory file instead of the default one.
command: ansible {{group}} -i {{inventory:inventory.ini}} -m command -a '{{command:uptime}}'
tool: ansible
category: cloud-iac
tags: [ad-hoc, inventory]
danger: caution
