id: aws-s3-sync-upload
title: Upload a directory to an S3 bucket
description: Copies the files that are new or changed in the directory to the bucket, overwriting objects with the same key but deleting nothing.
command: aws s3 sync {{path:.}} s3://{{bucket}}
tool: aws
category: cloud-iac
tags: [s3, sync]
danger: caution
