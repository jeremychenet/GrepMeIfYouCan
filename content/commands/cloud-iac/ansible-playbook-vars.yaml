id: ansible-playbook-vars
title: Run a playbook with a variable set on the command line
description: Runs the playbook with the given extra variable, which takes precedence over the values set in the inventory and roles.
command: ansible-playbook {{playbook:site.yml}} -e '{{name}}={{value}}'
tool: ansible
category: cloud-iac
tags: [playbook, variables]
danger: caution
