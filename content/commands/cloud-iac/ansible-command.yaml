id: ansible-command
title: Run a command on a group of hosts
description: Executes the command on every host of the group through the command module, without a shell, and prints each host's output.
command: ansible {{group}} -m command -a '{{command:uptime}}'
tool: ansible
category: cloud-iac
tags: [ad-hoc, remote]
danger: caution
