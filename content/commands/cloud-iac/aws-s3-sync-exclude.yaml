id: aws-s3-sync-exclude
title: Upload a directory to S3 except some files
description: Syncs the directory to the bucket, skipping every path that matches the exclude pattern.
command: aws s3 sync {{path:.}} s3://{{bucket}} --exclude '{{pattern:*.log}}'
tool: aws
category: cloud-iac
tags: [s3, sync]
danger: caution
