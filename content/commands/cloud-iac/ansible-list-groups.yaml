id: ansible-list-groups
title: List the groups in an inventory
description: Prints the names of all groups defined in the inventory, using the debug module on the local machine.
command: ansible localhost -m debug -a 'var=groups.keys()'
tool: ansible
category: cloud-iac
tags: [inventory]
danger: safe
