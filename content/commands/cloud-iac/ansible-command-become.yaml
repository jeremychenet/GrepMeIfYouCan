id: ansible-command-become
title: Run a command as root on a group of hosts
description: Executes the command with sudo on every host of the group, after prompting for the privilege escalation password.
command: ansible {{group}} -b -K -m command -a '{{command}}'
tool: ansible
category: cloud-iac
tags: [ad-hoc, sudo]
danger: caution
