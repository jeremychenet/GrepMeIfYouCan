id: ansible-playbook-vars-file
title: Run a playbook with variables from a JSON file
description: Runs the playbook with extra variables loaded from the file, which override every other variable source.
command: ansible-playbook {{playbook:site.yml}} -e @{{vars_file:vars.json}}
tool: ansible
category: cloud-iac
tags: [playbook, variables]
danger: caution
