id: aws-ec2-snapshot
title: Create a snapshot of an EBS volume
description: Starts a point-in-time snapshot of the volume, billed until it is deleted, and prints the snapshot ID.
command: aws ec2 create-snapshot --volume-id {{volume_id}}
tool: aws
category: cloud-iac
tags: [ec2, ebs, backup]
danger: safe
