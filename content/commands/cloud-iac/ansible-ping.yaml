id: ansible-ping
title: Check that Ansible can reach a group of hosts
description: Connects to each host of the group and runs the ping module, which confirms SSH access and a usable Python.
command: ansible {{group:all}} -m ping
tool: ansible
category: cloud-iac
tags: [ad-hoc, connectivity]
danger: safe
