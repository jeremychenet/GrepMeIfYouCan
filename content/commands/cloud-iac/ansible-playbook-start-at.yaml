id: ansible-playbook-start-at
title: Run a playbook starting from a specific task
description: Runs the playbook but skips every task before the one with the given name.
command: ansible-playbook {{playbook:site.yml}} --start-at-task '{{task_name}}'
tool: ansible
category: cloud-iac
tags: [playbook]
danger: caution
