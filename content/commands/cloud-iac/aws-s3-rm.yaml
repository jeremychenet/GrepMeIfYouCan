id: aws-s3-rm
title: Delete a file from an S3 bucket
description: Deletes the object at the given key, which is permanent unless versioning is enabled on the bucket.
command: aws s3 rm s3://{{bucket}}/{{key}}
tool: aws
category: cloud-iac
tags: [s3, storage]
danger: caution
