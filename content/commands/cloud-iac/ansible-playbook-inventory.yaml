id: ansible-playbook-inventory
title: Run a playbook against a specific inventory
description: Runs the playbook on the hosts listed in the given inventory file instead of the default one.
command: ansible-playbook -i {{inventory:inventory.ini}} {{playbook:site.yml}}
tool: ansible
category: cloud-iac
tags: [playbook, inventory]
danger: caution
