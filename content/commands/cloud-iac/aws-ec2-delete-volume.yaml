id: aws-ec2-delete-volume
title: Delete an EBS volume
description: Permanently deletes the volume and all its data; the volume must first be detached from any instance.
command: aws ec2 delete-volume --volume-id {{volume_id}}
tool: aws
category: cloud-iac
tags: [ec2, ebs]
danger: destructive
