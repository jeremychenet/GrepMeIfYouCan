id: aws-ec2-list-instances
title: List EC2 instances as a table
description: Prints the ID, state, type and private IP of every instance in the current region as a table.
command: aws ec2 describe-instances --query 'Reservations[].Instances[].[InstanceId,State.Name,InstanceType,PrivateIpAddress]' --output table
tool: aws
category: cloud-iac
tags: [ec2, compute]
danger: safe
