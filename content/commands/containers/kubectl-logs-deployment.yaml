id: kubectl-logs-deployment
title: Show the logs of a deployment
description: Prints the logs of one pod picked from the deployment, so you do not need to look up a pod name.
command: kubectl logs deployment/{{deployment}}
tool: kubectl
category: containers
tags: [kubernetes, logs]
danger: safe
