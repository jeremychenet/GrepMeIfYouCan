id: docker-exec-as-user
title: Run a command in a container as another user
description: Runs the command inside the container as the given user, for example root to install a debugging tool.
command: docker exec -it -u {{user:root}} {{container}} {{command:sh}}
tool: docker
category: containers
tags: [shell, debug]
danger: safe
