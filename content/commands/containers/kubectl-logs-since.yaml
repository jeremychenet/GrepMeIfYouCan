id: kubectl-logs-since
title: Show recent logs of a pod
description: Prints only the log lines written during the given recent period, such as 10m or 1h.
command: kubectl logs --since={{duration:1h}} {{pod}}
tool: kubectl
category: containers
tags: [kubernetes, logs]
danger: safe
