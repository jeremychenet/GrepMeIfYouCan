id: docker-run-bind-mount
title: Run a container with a mounted directory
description: Shares a host directory with the container, so changes made on either side are visible to both.
command: docker run -v {{host_path:$PWD}}:{{container_path:/data}} {{image}}
tool: docker
category: containers
tags: [run, volumes]
danger: safe
