id: docker-logs-since
title: Show recent logs with timestamps
description: Prints the log lines written since the given duration or date, each prefixed with its timestamp.
command: docker logs -t --since {{since:10m}} {{container}}
tool: docker
category: containers
tags: [logs]
danger: safe
