id: docker-run-entrypoint
title: Override the image entrypoint
description: Starts the container with another program instead of the image's default entrypoint, which helps debug images.
command: docker run --rm -it --entrypoint {{entrypoint:sh}} {{image}}
tool: docker
category: containers
tags: [run, debug]
danger: safe
