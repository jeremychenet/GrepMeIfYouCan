id: git-push-branch-to
title: Push a local branch to a differently named remote branch
description: Updates the remote branch with the commits of the local branch, and refuses if that would lose remote commits.
command: git push {{remote:origin}} {{local_branch}}:{{remote_branch}}
tool: git
category: git-ci
tags: [remote, push]
danger: safe
