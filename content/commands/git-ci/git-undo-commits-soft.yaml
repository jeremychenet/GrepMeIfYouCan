id: git-undo-commits-soft
title: Undo the last commits and keep them staged
description: Moves the branch back by the given number of commits and keeps their changes staged for a new commit.
command: git reset --soft HEAD~{{count:2}}
tool: git
category: git-ci
tags: [undo, commit]
danger: caution
