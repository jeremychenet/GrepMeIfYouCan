id: git-log-graph-all
title: Show a graph of all branches
description: Prints one line per commit of every branch and tag, with an ASCII graph of merges and the branch names.
command: git log --oneline --decorate --all --graph
tool: git
category: git-ci
tags: [history, log]
danger: safe
