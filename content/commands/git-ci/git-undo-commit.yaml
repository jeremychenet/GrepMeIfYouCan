id: git-undo-commit
title: Undo the last commit but keep its changes
description: Moves the branch back one commit and leaves the changes of that commit unstaged in the working tree.
command: git reset HEAD~
tool: git
category: git-ci
tags: [undo, commit]
danger: caution
