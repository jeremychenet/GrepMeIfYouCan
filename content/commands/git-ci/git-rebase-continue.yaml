id: git-rebase-continue
title: Continue a rebase after fixing conflicts
description: Resumes the rebase once the conflicting files are fixed and staged with git add.
command: git rebase --continue
tool: git
category: git-ci
tags: [rebase, conflicts]
danger: safe
