id: gh-run-job-log
title: Show the log of a GitHub Actions job
description: Prints the full log of the job, step by step, to debug a failure.
command: gh run view --job {{job_id}} --log
tool: gh
category: git-ci
tags: [ci, actions, logs]
danger: safe
