id: git-reset-hard-commit
title: Reset the branch to a given commit
description: Moves the current branch to the commit and discards every commit, staged and unstaged change made after it.
command: git reset --hard {{commit}}
tool: git
category: git-ci
tags: [undo, history]
danger: destructive
