id: git-push-upstream
title: Push a new branch and track it
description: Pushes the branch to the remote and sets it as upstream, so later git push and git pull need no arguments.
command: git push -u {{remote:origin}} {{branch}}
tool: git
category: git-ci
tags: [remote, push]
danger: safe
