id: git-push-delete-branch
title: Delete a remote branch
description: Deletes the branch on the remote for everyone who uses it, while local copies of the branch are kept.
command: git push {{remote:origin}} --delete {{branch}}
tool: git
category: git-ci
tags: [remote, branch]
danger: destructive
