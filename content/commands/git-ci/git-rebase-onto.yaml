id: git-rebase-onto
title: Move commits onto a new base
description: Replays the commits of the current branch made after the old base on top of the new base, giving them new hashes.
command: git rebase --onto {{new_base}} {{old_base}}
tool: git
category: git-ci
tags: [rebase, history]
danger: caution
