id: git-push-prune
title: Delete remote branches missing locally
description: Pushes every local branch and deletes the remote branches that have no local counterpart, which can remove other people's work.
command: git push --prune {{remote:origin}} 'refs/heads/*:refs/heads/*'
tool: git
category: git-ci
tags: [remote, branch, cleanup]
danger: destructive
