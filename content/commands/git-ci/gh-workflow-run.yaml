id: gh-workflow-run
title: Trigger a workflow manually
description: Starts a workflow_dispatch run of the workflow on the default branch, passing the value for the input.
command: gh workflow run {{workflow}} -f {{input}}={{value}}
tool: gh
category: git-ci
tags: [ci, actions]
danger: caution
