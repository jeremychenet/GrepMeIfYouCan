id: git-diff-stat
title: Summarize changes since a commit
description: Prints the files changed between the commit and the working tree, with a histogram and the total of added and removed lines.
command: git diff --stat {{commit}}
tool: git
category: git-ci
tags: [diff]
danger: safe
