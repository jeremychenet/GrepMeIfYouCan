id: rsync-contents-only
title: Copy a directory's contents, not the directory
description: Copies everything inside the source directory into the destination, without creating a source subfolder there.
command: rsync -a {{source}}/ {{destination}}
tool: rsync
category: linux
tags: [sync, files]
danger: safe
platforms: [linux, macos]
