id: journalctl-errors-previous-boot
title: Show errors from the previous boot
description: Lists messages of priority error or worse logged during the boot before the current one.
command: journalctl -b -1 -p err
tool: journalctl
category: linux
tags: [logs, systemd, troubleshooting]
danger: safe
platforms: [linux]
