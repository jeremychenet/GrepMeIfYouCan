id: journalctl-follow-service
title: Follow the logs of a service
description: Shows the latest log entries of the service and keeps streaming new ones as they are written.
command: journalctl -u {{service}} -f
tool: journalctl
category: linux
tags: [logs, systemd, services]
danger: safe
platforms: [linux]
