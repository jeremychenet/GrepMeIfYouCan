id: find-delete-empty
title: Delete empty files and directories
description: Deletes every empty file and empty directory under the path and prints each one it removes.
command: find {{path}} -empty -delete -print
tool: find
category: linux
tags: [files, cleanup]
danger: destructive
platforms: [linux, macos]
