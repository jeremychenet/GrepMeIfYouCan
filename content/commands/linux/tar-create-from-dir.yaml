id: tar-create-from-dir
title: Archive a directory's contents with relative paths
description: Compresses everything inside the directory so that paths in the archive start at its root instead of the full path.
command: tar -czf {{archive:archive.tar.gz}} -C {{path}} .
tool: tar
category: linux
tags: [archive, compression]
danger: safe
platforms: [linux, macos]
