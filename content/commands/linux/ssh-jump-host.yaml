id: ssh-jump-host
title: Connect through a jump host
description: Reaches a server that is only accessible from a bastion by hopping through the bastion first.
command: ssh -J {{user}}@{{jump_host}} {{user}}@{{host}}
tool: ssh
category: linux
tags: [remote, bastion]
danger: safe
platforms: [linux, macos]
