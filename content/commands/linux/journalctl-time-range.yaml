id: journalctl-time-range
title: Show logs within a time range
description: Prints log entries written between the two times, which accept dates or phrases like yesterday or 1 hour ago.
command: journalctl --since "{{since:1 hour ago}}" --until "{{until:now}}"
tool: journalctl
category: linux
tags: [logs, systemd]
danger: safe
platforms: [linux]
