id: journalctl-vacuum
title: Delete old journal logs
description: Removes archived journal files older than the given age to free disk space.
command: sudo journalctl --vacuum-time={{age:2d}}
tool: journalctl
category: linux
tags: [logs, disk, cleanup]
danger: caution
platforms: [linux]
