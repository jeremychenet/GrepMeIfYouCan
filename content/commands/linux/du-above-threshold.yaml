id: du-above-threshold
title: List items above a size threshold
description: Lists files and directories under the path whose size is at least the threshold.
command: du -ah -t {{size:1G}} {{path:.}}
tool: du
category: linux
tags: [disk, usage, cleanup]
danger: safe
