id: find-dirs-by-name
title: Find directories by name, ignoring case
description: Recursively lists directories whose name matches the pattern, regardless of upper or lower case.
command: find {{path:.}} -type d -iname '{{name:*cache*}}'
tool: find
category: linux
tags: [files, search]
danger: safe
platforms: [linux, macos]
