id: chmod-octal
title: Set permissions with an octal mode
description: Replaces the permissions of the file with the octal mode, such as 644 for owner write and read for everyone.
command: chmod {{mode:644}} {{file}}
tool: chmod
category: linux
tags: [permissions, files]
danger: safe
platforms: [linux, macos]
