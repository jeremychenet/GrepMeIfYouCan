id: rsync-ssh-port
title: Copy to a remote host over SSH on a custom port
description: Transfers files to a remote machine through an SSH server listening on a non-default port.
command: rsync -a -e 'ssh -p {{port:2222}}' {{source}} {{user}}@{{host}}:{{destination}}
tool: rsync
category: linux
tags: [sync, transfer, remote]
danger: safe
platforms: [linux, macos]
