id: find-by-extension
title: Find files by extension
description: Recursively lists regular files whose name ends with the given extension under a directory.
command: find {{path:.}} -type f -name '*.{{extension:log}}'
tool: find
category: linux
tags: [files, search]
danger: safe
platforms: [linux, macos]
