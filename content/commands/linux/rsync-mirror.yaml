id: rsync-mirror
title: Mirror a directory, deleting extra files
description: Makes the destination an exact copy of the source, deleting destination files that no longer exist in the source.
command: rsync -a --delete {{source}}/ {{destination}}
tool: rsync
category: linux
tags: [sync, backup]
danger: destructive
platforms: [linux, macos]
