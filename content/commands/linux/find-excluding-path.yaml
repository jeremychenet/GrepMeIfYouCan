id: find-excluding-path
title: Find files while excluding a path
description: Lists files matching a name pattern but skips everything whose path matches the excluded pattern.
command: find {{path:.}} -name '{{pattern:*.py}}' -not -path '{{excluded:*/node_modules/*}}'
tool: find
category: linux
tags: [files, search]
danger: safe
platforms: [linux, macos]
