id: find-size-range
title: Find files within a size range
description: Recursively lists regular files bigger than the minimum and smaller than the maximum size.
command: find {{path:.}} -type f -size +{{min:500k}} -size -{{max:10M}}
tool: find
category: linux
tags: [files, disk]
danger: safe
platforms: [linux, macos]
