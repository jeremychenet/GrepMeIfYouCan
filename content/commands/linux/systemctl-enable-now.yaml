id: systemctl-enable-now
title: Enable a service at boot and start it
description: Configures the service to start automatically at boot and starts it right away.
command: sudo systemctl enable --now {{service}}
tool: systemctl
category: linux
tags: [systemd, services, boot]
danger: caution
platforms: [linux]
