id: chmod-recursive-read
title: Give everyone read access to a directory tree
description: Recursively grants read to all users, plus execute on directories and on files that are already executable.
command: chmod -R a+rX {{path}}
tool: chmod
category: linux
tags: [permissions, files]
danger: caution
platforms: [linux, macos]
