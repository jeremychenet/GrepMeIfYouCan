id: ssh-socks-proxy
title: Open a SOCKS proxy through a server
description: Starts a local SOCKS proxy on the port that routes traffic through the remote server, without opening a shell.
command: ssh -D {{local_port:1080}} -N {{user}}@{{host}}
tool: ssh
category: linux
tags: [remote, tunnel, proxy]
danger: safe
platforms: [linux, macos]
