id: du-list-all-files-and-directories-including-hidden-ones
title: List all files and directories (including hidden ones) above a certain threshold size (useful for investigating what is actually taking up the space)
description: ""
command: du --all --human-readable --threshold {{1G|1024M|1048576K}} .[^.]* *
