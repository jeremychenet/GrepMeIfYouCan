# Production overlay (SPEC §6.5, §6.7): docker compose -f compose.yaml -f compose.prod.yaml
# Same files on the server and on the Mac (`make prod-local`). Analytics run
# in prod: start with `--profile analytics`.
#
# Hardening of every service (checked by tests/config/compose-prod.test.ts):
# non-root, read-only file system (tmpfs where a service must write), no
# capability, no-new-privileges, memory/CPU/process limits, healthcheck, log
# rotation, restart. No code is mounted: the site is inside the image.
#
# Variables (.env on the server, set by the Makefile for prod-local):
#   IMAGE_TAG        image to run (commit SHA in prod, `local` for prod-local)
#   WEB_BIND         address that publishes 80/443: 127.0.0.1 unless set,
#                    the server's .env sets 0.0.0.0
#   LETSENCRYPT_DIR  certificates: the `letsencrypt` volume (certbot, J20) or
#                    ./.cache/tls (self-signed, prod-local)
# Its own project name, so prod-local never touches the dev containers.
name: grepmeifyoucan-prod

x-hardening: &hardening
  restart: unless-stopped
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

services:
  web:
    <<: *hardening
    image: ghcr.io/jeremychenet/grepmeifyoucan-web:${IMAGE_TAG:?set IMAGE_TAG (commit SHA, or local)}
    build:
      target: prod
      args:
        # Always the public domain, even for prod-local: same image everywhere.
        PUBLIC_BASE_URL: https://grepmeifyoucan.com
        PUBLIC_UMAMI_WEBSITE_ID: ${PUBLIC_UMAMI_WEBSITE_ID:-}
    read_only: true
    tmpfs:
      - /tmp:size=16m
    volumes:
      - ${LETSENCRYPT_DIR:-letsencrypt}:/etc/letsencrypt:ro
      - certbot-webroot:/var/www/certbot:ro
    ports:
      - "${WEB_BIND:-127.0.0.1}:80:8080"
      - "${WEB_BIND:-127.0.0.1}:443:8443"
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 128M
          pids: 100
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  db:
    <<: *hardening
    # The image's own `postgres` user (uid 70 on Alpine): the entrypoint then
    # skips its root-only steps (chown, gosu), so no capability is needed.
    user: "70:70"
    read_only: true
    tmpfs:
      - /var/run/postgresql:size=1m,uid=70,gid=70
      - /tmp:size=16m
    shm_size: 128m
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
          pids: 100

  umami:
    <<: *hardening
    # Already non-root in its image (nextjs, uid 1001).
    read_only: true
    tmpfs:
      - /tmp:size=32m
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
          pids: 200

  # Let's Encrypt (SPEC §6.7, J20). Runs as nginx's uid (101): the private key
  # it writes (600) stays readable by `web` without loosening anything. The
  # first certificate is issued once by deploy/setup-server.sh (webroot), then
  # this loop renews it (certbot only acts within 30 days of expiry); `web`
  # reloads its config every 6 hours to pick it up.
  # Always the named volume, even while `web` still reads LETSENCRYPT_DIR.
  certbot:
    <<: *hardening
    image: certbot/certbot:v5.8.0
    init: true
    user: "101:101"
    read_only: true
    tmpfs:
      - /tmp:size=16m,uid=101,gid=101
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot
    entrypoint:
      - /bin/sh
      - -c
      - |
        trap 'exit 0' TERM INT
        while :; do
          certbot renew --quiet --config-dir /etc/letsencrypt \
            --work-dir /tmp/certbot --logs-dir /tmp/certbot/logs \
            || echo "certbot renew failed" >&2
          touch /tmp/last-run
          sleep 43200 & wait $$!
        done
    # Alive and looping (a failed renewal is logged; the certificate still
    # has weeks left when renewal starts).
    healthcheck:
      test: ["CMD-SHELL", "find /tmp/last-run -mmin -780 | grep -q ."]
      interval: 1m
      timeout: 5s
      retries: 3
      start_period: 1m
      start_interval: 5s
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
          pids: 50

  # Daily pg_dump of the Umami database (SPEC §6.7, J20), 14 days kept in
  # BACKUP_DIR (/opt/grepmeifyoucan/backups on the server, readable by the
  # admin group); `make backup-pull` copies them off the server and tests a
  # restore. Same image as `db` (tests/config/compose-prod.test.ts).
  backup:
    <<: *hardening
    image: postgres:18.6-alpine3.24
    profiles: [analytics]
    init: true
    user: "70:70"
    read_only: true
    tmpfs:
      - /tmp:size=16m
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: umami
      PGDATABASE: umami
      PGPASSWORD: ${UMAMI_DB_PASSWORD:-}
    networks: [analytics]
    volumes:
      - ${BACKUP_DIR:-./.cache/backups}:/backups
    entrypoint:
      - /bin/sh
      - -c
      - |
        umask 027
        trap 'exit 0' TERM INT
        while :; do
          f="/backups/umami-$$(date -u +%Y%m%dT%H%M%SZ).dump"
          if pg_dump --format=custom --file="$$f.tmp" && mv "$$f.tmp" "$$f"; then
            echo "backup: $$f"
          else
            rm -f "$$f.tmp"
            echo "backup FAILED" >&2
          fi
          find /backups -name 'umami-*.dump' -mtime +14 -delete
          sleep 86400 & wait $$!
        done
    # A dump less than 26 hours old.
    healthcheck:
      test: ["CMD-SHELL", "find /backups -name 'umami-*.dump' -mmin -1560 | grep -q ."]
      interval: 5m
      timeout: 5s
      retries: 3
      start_period: 2m
      start_interval: 5s
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
          pids: 50

volumes:
  letsencrypt:
  certbot-webroot:
