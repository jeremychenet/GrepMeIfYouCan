name: Suggest a command
description: Propose a shell command for GrepMeIfYouCan.
title: 'Suggest a command: '
labels: [suggestion]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping! A command needs at least a **title**, the **command** and a **description**.
        Every suggestion is reviewed before it is published.
  - type: input
    id: card-title
    attributes:
      label: Title
      description: What the command does, in a few words, as people would search for it.
      placeholder: Find files larger than a given size
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command
      description: One line. Write the values to adapt as `{{name}}`, or `{{name:default}}` when a default is obvious and safe.
      placeholder: find {{path:.}} -type f -size +{{size:100M}}
      render: shell
    validations:
      required: true
  - type: input
    id: description
    attributes:
      label: Description
      description: One sentence explaining what the command does (180 characters max).
      placeholder: Recursively lists regular files bigger than the given size under a directory.
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - Linux
        - Unix
        - Containers
        - Cloud & IaC
        - Git & CI
    validations:
      required: true
  - type: input
    id: tags
    attributes:
      label: Tags
      description: A few keywords, separated by commas.
      placeholder: files, disk, cleanup
  - type: checkboxes
    id: platforms
    attributes:
      label: Platforms
      description: Where the command works as written.
      options:
        - label: Linux
        - label: macOS
        - label: Unix
  - type: dropdown
    id: danger
    attributes:
      label: Danger level
      description: "`destructive` if it can delete or overwrite data, `caution` if it changes the system, `safe` if it only reads."
      options:
        - safe
        - caution
        - destructive
        - not sure
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Source
      description: Optional link to the documentation or where the command comes from.
      placeholder: https://man7.org/linux/man-pages/man1/find.1.html
