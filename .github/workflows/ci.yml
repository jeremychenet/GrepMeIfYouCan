name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Same Node version as docker/web.Dockerfile (enforced by tests/config).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests + coverage thresholds
        run: npm run coverage

      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage/
          retention-days: 14

      # Also runs as the first step of `npm run build`; kept separate for a clear failure.
      - name: Validate content (schema + danger lint)
        run: npm run lint-content

      # Drafts have no description yet: only the danger + character checks apply.
      - name: Danger lint of drafts
        run: npm run lint-danger -- content/drafts

      - name: Build
        run: npm run build
        env:
          ASTRO_TELEMETRY_DISABLED: '1'

  docker:
    name: docker
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build web image (dev target, not pushed)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/web.Dockerfile
          target: dev
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Validate Nginx config
        run: |
          image=$(sed -n 's/^ *image: *\(nginxinc\/nginx-unprivileged:.*\)$/\1/p' compose.yaml)
          docker run --rm --add-host web:127.0.0.1 \
            -v "$PWD/docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro" \
            -v "$PWD/docker/nginx/security-headers.conf:/etc/nginx/snippets/security-headers.conf:ro" \
            -v "$PWD/docker/nginx/csp.dev.conf:/etc/nginx/snippets/csp.conf:ro" \
            "$image" nginx -t
