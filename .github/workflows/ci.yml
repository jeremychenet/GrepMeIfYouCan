name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Same Node version as docker/web.Dockerfile (enforced by tests/config).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests + coverage thresholds
        run: npm run coverage

      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage/
          retention-days: 14

      # Also runs as the first step of `npm run build`; kept separate for a clear failure.
      - name: Validate content (schema + danger lint)
        run: npm run lint-content

      # Drafts have no description yet: only the danger + character checks apply.
      - name: Danger lint of drafts
        run: npm run lint-danger -- content/drafts

      - name: Build
        run: npm run build
        env:
          ASTRO_TELEMETRY_DISABLED: '1'

      # One page per card/tool/category, title + description + canonical, danger, sitemap.
      - name: Check built site
        run: npm run check-dist

  # Playwright on the built site, served by `astro preview` (playwright.config.ts).
  e2e:
    name: e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # Same version as @playwright/test (installed from package-lock.json).
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build
        env:
          ASTRO_TELEMETRY_DISABLED: '1'
          # Fake id: adds the tracker tag so tests/e2e/analytics.spec.ts runs
          # (with a stub script; nothing is sent anywhere).
          PUBLIC_UMAMI_WEBSITE_ID: 00000000-0000-4000-8000-000000000000

      - name: End-to-end tests
        run: npx playwright test

      - name: Upload Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  # Lighthouse CI (mobile) on the built site: budgets in lighthouserc.json
  # (SPEC §8: >= 95 on the 4 categories, LCP < 1.5 s). Uses the runner's Chrome.
  lighthouse:
    name: lighthouse
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build
        run: npm run build
        env:
          ASTRO_TELEMETRY_DISABLED: '1'

      - name: Lighthouse CI
        run: npx lhci autorun

      - name: Upload Lighthouse reports
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse
          path: .lighthouseci/
          retention-days: 14

  docker:
    name: docker
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build web image (dev target, not pushed)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/web.Dockerfile
          target: dev
          push: false
          cache-from: type=gha,scope=dev
          cache-to: type=gha,mode=max,scope=dev

      - name: Validate dev Nginx config
        run: |
          image=$(sed -n 's/^ *image: *\(nginxinc\/nginx-unprivileged:.*\)$/\1/p' compose.dev.yaml)
          docker run --rm --add-host web:127.0.0.1 \
            -v "$PWD/docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro" \
            -v "$PWD/docker/nginx/security-headers.conf:/etc/nginx/snippets/security-headers.conf:ro" \
            -v "$PWD/docker/nginx/csp.dev.conf:/etc/nginx/snippets/csp.conf:ro" \
            -v "$PWD/docker/nginx/stats-proxy.conf:/etc/nginx/snippets/stats-proxy.conf:ro" \
            "$image" nginx -t

      # The site is built inside the image: lint-content and the Astro build
      # run again here, as on the server.
      - name: Build web image (prod target, not pushed)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/web.Dockerfile
          target: prod
          push: false
          load: true
          tags: grepmeifyoucan-web:ci
          cache-from: type=gha,scope=prod
          cache-to: type=gha,mode=max,scope=prod

      - name: Validate prod Nginx config (with a throwaway certificate)
        run: |
          scripts/make-local-cert.sh "$RUNNER_TEMP/tls"
          docker run --rm --entrypoint nginx -v "$RUNNER_TEMP/tls:/etc/letsencrypt:ro" grepmeifyoucan-web:ci -t

      - name: Prod image is under 50 MB
        run: |
          size=$(docker image inspect -f '{{.Size}}' grepmeifyoucan-web:ci)
          echo "web image: $((size / 1000000)) MB"
          test "$size" -lt 50000000
