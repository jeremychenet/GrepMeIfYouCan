# Pages imported from tldr-pages by scripts/import-tldr.ts (SPEC §4.2).
#
# - commit: tldr-pages commit every page is read at. Bumping it is a
#   reviewed change: re-run `make import-tldr` and review the diff.
# - page: path under tldr's pages/ folder (common/… or linux/…).
# - tool: the card's `tool` (docker-container-run.md → docker).
# - tags: tags given to every card of the page (kebab-case).
# - examples: 1-based numbers of the examples to keep (default: all).
